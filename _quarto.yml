project:
  type: website
  output-dir: docs

lang: en

execute:
  freeze: false
  cache: false

format:
  html:
    theme:
      light: flatly
      dark:  darkly
    callout-appearance: simple
    css: assets/styles.css
    toc: true
    smooth-scroll: true
    highlight-style: atom-one
    number-sections: true
    number-depth: 3
    pagetitle: "{{< var meta.title >}}"

website:
  title: "GEOG0187"
  repo-url: https://github.com/jtvandijk/GEOG0187
  repo-actions: [issue]
  page-navigation: true
  page-footer:
    center: "Course material by [Justin van Dijk](https://www.mappingdutchman.com). Available under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)."
  search:
    location: sidebar
    type: overlay
  sidebar:
    style: floating
    collapse-level: 2
    logo: assets/logo.svg
    tools:
      - icon: github
        href: https://github.com/jtvandijk/GEOG0187
    contents:
      - section: "Module overview"
        contents:
          - text: "Welcome"
            file: index.qmd
      - section: "Spatial Data Collection"
        contents:
          - text: "1 Fieldwork Preparation"
            file: 01-fieldwork.qmd
      - section: "Mapping"
        contents:
          - text: "2 Mapping Your Field Data"
            file: 02-mapping.qmd
          - text: "3 Building a Story Map"
            file: 03-storymap.qmd
          - text: "4 Using Secondary Data"
            file: 04-secondary.qmd
      - section: "Statistics"
        contents:
          - text: "5 Describing Data"
            file: 05-describing.qmd
          - text: "6 Samples and Uncertainty"
            file: 06-uncertainty.qmd
          - text: "7 Testing Differences"
            file: 07-testing.qmd

editor: source
